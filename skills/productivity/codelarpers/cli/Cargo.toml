[package]
name = "codelarpers"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Local CodeCrafters-style challenge platform: CLI, test harness and web UI"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
mime_guess = "2"
notify = "8"
regex = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
